name: FOUND Checkpoint
on:
  workflow_dispatch:
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - env:
          DATABASE_URL: ${{ secrets.FOUND_DATABASE_URL }}
        run: npm run checkpoint
